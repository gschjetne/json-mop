name: CI

# Runs on push to any branch, on pull requests to master, and on demand.
on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: ${{ matrix.lisp }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A pinned SBCL for reproducible results, plus the latest
        # SBCL binary Roswell offers to catch upstream breakage early.
        lisp: [ sbcl-bin/2.4.1, sbcl-bin ]
        os: [ ubuntu-latest ]

    steps:
    - uses: actions/checkout@v4

    - name: cache .roswell
      id: cache-dot-roswell
      uses: actions/cache@v4
      with:
        path: ~/.roswell
        key: ${{ runner.os }}-dot-roswell-${{ matrix.lisp }}-${{ hashFiles('**/*.asd') }}
        restore-keys: |
          ${{ runner.os }}-dot-roswell-${{ matrix.lisp }}-
          ${{ runner.os }}-dot-roswell-

    - name: install roswell
      shell: bash
      # Always run the install: it does global setup that isn't cached.
      # The script is pinned to a Roswell release tag rather than master.
      env:
        LISP: ${{ matrix.lisp }}
      run: curl -L https://raw.githubusercontent.com/roswell/roswell/v23.10.14.114/scripts/install-for-ci.sh | sh

    - name: show lisp
      shell: bash
      run: |
        ros -e '(format t "~a:~a on ~a~%" (lisp-implementation-type) (lisp-implementation-version) (machine-type))'

    - name: update ql dist if we have one cached
      shell: bash
      run: ros -e "(ql:update-all-dists :prompt nil)"

    - name: load code and run tests
      shell: bash
      run: |
        ros -e "(ql:quickload 'json-mop-tests)" -e "(unless (fiveam:run! 'json-mop-tests:test-all) (uiop:quit 1))"

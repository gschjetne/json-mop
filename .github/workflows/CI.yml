name: CI

# Runs on push to any branch, on pull requests to master, and on demand.
on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: ${{ matrix.lisp }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Experimental entries report their result but do not fail the run.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Required: the implementations and platforms people actually
          # use for this library, per the 2024 Common Lisp Community
          # Survey (SBCL is the primary implementation for ~88% of
          # respondents; CCL and ECL are the most used secondary ones).
          #
          # SBCL pinned for reproducibility, and latest to catch
          # upstream breakage early.
          - { lisp: sbcl-bin/2.4.1, os: ubuntu-latest }
          - { lisp: sbcl-bin,       os: ubuntu-latest }
          # macos-latest is Apple Silicon; covers the second most
          # common development platform for about a minute of runtime.
          - { lisp: sbcl-bin,       os: macos-latest }
          # CCL: a different CLOS/MOP implementation, installs in
          # under a minute. Linux only: no arm64 CCL exists for the
          # macOS runners.
          - { lisp: ccl-bin,        os: ubuntu-latest }
          # ECL: third most used implementation; Roswell builds it from
          # source (~5 min uncached), the build is then cached.
          - { lisp: ecl,            os: ubuntu-latest }

          # Experimental: known not to pass yet, tracked in issues.
          # ABCL: slot options are not stored on custom slot-definition
          # metaobjects, see issue #23.
          - { lisp: abcl-bin,       os: ubuntu-latest, experimental: true }

          # Deliberately not tested:
          # - windows-latest: Roswell's install-for-ci.sh calls pacman
          #   and fails; the library has no OS-specific code, so SBCL
          #   on Linux and macOS is representative.
          # - clasp-bin: Roswell's binary needs libLLVM-13, absent on
          #   ubuntu-latest.
          # - clisp: Yason's output stream lacks STREAM-LINE-COLUMN on
          #   CLISP, so encoding fails inside the dependency.
    steps:
    - uses: actions/checkout@v4

    - name: cache .roswell
      id: cache-dot-roswell
      uses: actions/cache@v4
      with:
        path: ~/.roswell
        key: ${{ runner.os }}-dot-roswell-${{ matrix.lisp }}-${{ hashFiles('**/*.asd') }}
        restore-keys: |
          ${{ runner.os }}-dot-roswell-${{ matrix.lisp }}-
          ${{ runner.os }}-dot-roswell-

    - name: install roswell
      shell: bash
      # Always run the install: it does global setup that isn't cached.
      # The script is pinned to a Roswell release tag rather than master.
      env:
        LISP: ${{ matrix.lisp }}
      run: curl -L https://raw.githubusercontent.com/roswell/roswell/v23.10.14.114/scripts/install-for-ci.sh | sh

    - name: show lisp
      shell: bash
      run: |
        ros -e '(format t "~a:~a on ~a~%" (lisp-implementation-type) (lisp-implementation-version) (machine-type))'

    - name: update ql dist if we have one cached
      shell: bash
      run: ros -e "(ql:update-all-dists :prompt nil)"

    - name: load code and run tests
      shell: bash
      run: |
        ros -e "(ql:quickload 'json-mop-tests)" -e "(unless (fiveam:run! 'json-mop-tests:test-all) (uiop:quit 1))"
